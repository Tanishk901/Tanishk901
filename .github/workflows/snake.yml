name: Feed the snake

on:
  schedule:
    - cron: "17 0 * * *"   # once a day
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Draw the snake from my contribution graph
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#FFB547&color_dots=#221B5C,#3B3486,#5B4BC7,#3FB8B0,#5CF2E6
            dist/snake-light.svg?color_snake=#E07F00&color_dots=#E6E1FF,#C9C2F2,#9B8FE6,#3FB8B0,#14968D

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
